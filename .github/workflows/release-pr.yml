name: Create Release PR

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: release-pr
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    environment:
      name: release-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update PR
        uses: repo-sync/pull-request@v2
        with:
          source_branch: dev
          destination_branch: master
          pr_title: "chore: merge dev → master"
          pr_body: |
            Automated PR to merge `dev` into `master`.

            This workflow runs on every push to `dev`, but job execution can
            be gated by required reviewers on the `release-pr` environment.
            That keeps PR creation automatic while still requiring approval.

            ---
            _Created via Release PR workflow._
          pr_label: "release"
          github_token: ${{ secrets.GITHUB_TOKEN }}
