[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zero-ichi"
version = "0.1.0"
description = "WhatsApp Bot built with 💖"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "neonize @ git+https://github.com/krypton-byte/neonize.git@4fae9daaada242b64e6235219b759c5f434a814b",
    "qrcode>=7.4",
    "rich>=13.0",
    "watchfiles>=1.1.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "apscheduler>=3.10.0",
    "pydantic-ai>=1.48.0",
    "python-dotenv>=1.2.1",
    "jsonschema>=4.23.0",
    "sqlalchemy>=2.0.43",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2.9",
    "yt-dlp==2026.6.9",
    "gallery-dl>=1.31.7",
    "Pillow>=10.0.0",
    "pyrogram>=2.0",
    "tgcrypto>=1.2",
]

[project.scripts]
zero-ichi = "main:main"

[dependency-groups]
dev = ["ruff>=0.9.0", "pytest>=8.4.0", "pytest-asyncio>=1.1.0", "alembic>=1.14.0"]

[tool.uv]
override-dependencies = [
    "protobuf>=7.34.1",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/core",
    "src/commands",
    "src/config",
    "src/ai",
    "src/main.py",
    "src/dashboard_api.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "__pycache__", "build", "dist"]
src = ["src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "W191", # indentation contains tabs
]

[tool.ruff.lint.isort]
known-first-party = ["core", "commands", "config", "ai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
